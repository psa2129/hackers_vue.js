name: Build and Deploy via Harbor

on:
  push:
    branches:
      - main

env:
  APP_NAME: sk041-vue

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
      HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}

      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
      K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image metadata
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_TAG=${GITHUB_RUN_NUMBER}-${SHORT_SHA}
          IMAGE_REPO=${HARBOR_REGISTRY}/${HARBOR_PROJECT}/${APP_NAME}
          FULL_IMAGE=${IMAGE_REPO}:${IMAGE_TAG}

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "IMAGE_REPO=${IMAGE_REPO}" >> $GITHUB_ENV
          echo "FULL_IMAGE=${FULL_IMAGE}" >> $GITHUB_ENV

      - name: Build application
        run: |
          echo "Skipping package build for this practice"
          echo "Using current Dockerfile-based image build"

      - name: Log in to Harbor
        run: |
          echo "${HARBOR_PASSWORD}" | docker login ${HARBOR_REGISTRY} -u "${HARBOR_USERNAME}" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${FULL_IMAGE} .

      - name: Push Docker image to Harbor
        run: |
          docker push ${FULL_IMAGE}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_DATA}" | base64 -d > ~/.kube/config

      - name: Render deployment manifest
        run: |
          cp deploy/deployment.yaml deploy/deployment-rendered.yaml
          sed -i "s|__IMAGE__|${FULL_IMAGE}|g" deploy/deployment-rendered.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -n ${K8S_NAMESPACE} -f deploy/deployment-rendered.yaml --validate=false
          kubectl apply -n ${K8S_NAMESPACE} -f deploy/service.yaml --validate=false

      - name: Check rollout status
        run: |
          kubectl rollout status deployment/${APP_NAME} -n ${K8S_NAMESPACE} --timeout=300s
          kubectl get pods -n ${K8S_NAMESPACE}
          kubectl get svc -n ${K8S_NAMESPACE}

      - name: Logout Harbor
        if: always()
        run: |
          docker logout ${HARBOR_REGISTRY} || true
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: clone-and-build-sk041
  namespace: class-2
spec:
  params:
    - name: repo-url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-source
      taskRef:
        kind: Task
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: ouput
          workspace: shared-workspace
